spring.application.name=aula.semana.2

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:carros
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria a tabela "carros" a partir da entidade Carro
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do banco: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:carros)
spring.h2.console.enabled=true

# Mostra a mensagem de erro no corpo da resposta (ex.: "Carro nao encontrado para o id 2")
spring.web.error.include-message=always
